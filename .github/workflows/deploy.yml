name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Пропустить, пока не настроены secrets (см. docs/DEPLOY-IP.md)
    if: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' && secrets.VPS_APP_PATH != '' }}
    steps:
      - name: Check SSH key format
        run: |
          KEY="${{ secrets.VPS_SSH_KEY }}"
          if ! echo "$KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "::error::VPS_SSH_KEY должен быть ПРИВАТНЫМ ключом целиком, с строками BEGIN/END PRIVATE KEY."
            echo "Не публичный (.pub) ключ и не passphrase."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            set -a
            [ -f .env ] && . ./.env
            set +a
            curl -fsS "http://127.0.0.1:${APP_PORT:-80}/up" >/dev/null
            echo "Deploy OK"
